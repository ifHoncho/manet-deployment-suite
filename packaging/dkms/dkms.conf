# DKMS configuration for the pinned batman-adv release used by Trellis.
# PACKAGE_VERSION is substituted by install-batman-adv-dkms.sh.
PACKAGE_NAME="trellis-batman-adv"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="batman-adv"
BUILT_MODULE_LOCATION[0]="net/batman-adv"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# trellis-build.sh picks the gcc major version the kernel was built with.
MAKE[0]="sh ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/trellis-build.sh ${kernel_source_dir}"
CLEAN="cd ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build && make KERNELPATH=${kernel_source_dir} clean"
AUTOINSTALL="yes"
